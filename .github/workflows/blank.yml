name: Postman API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Newman
        run: npm install -g newman newman-reporter-html
      
      - name: Run Postman Tests - Get Token API
        run: |
          newman run postman/collections/REST_API_test.postman_collection.json \
            -e postman/environments/Test_Environment.postman_environment.json \
            --reporters cli,json,html \
            --reporter-json-export ./results/postman-results.json \
            --reporter-html-export ./results/postman-results.html
        continue-on-error: false
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-results
          path: results/
      
      - name: Comment Test Results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('./results/postman-results.json', 'utf8'));
            const stats = results.run.stats;
            
            const comment = `## Postman Test Results
            - **Requests**: ${stats.requests.total}
            - **Failed**: ${stats.assertions.failed} ❌
            - **Passed**: ${stats.assertions.total - stats.assertions.failed} ✅
            
            [View Full Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
