name: API Tests — Newman

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

# ✅ Fix Error 2 — give workflow permission to write checks
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and reporters
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
          npm install -g newman-reporter-junitfull

      - name: Create reports folder
        run: mkdir -p reports

      - name: Inject secrets into environment file
        run: |
          cat postman/Test_Environment.postman_environment.json | \
          jq '.values |= map(
            if .key == "BaseURL" then .value = "${{ secrets.BASE_URL }}"
            elif .key == "Username" then .value = "${{ secrets.API_USERNAME }}"
            elif .key == "Password" then .value = "${{ secrets.API_PASSWORD }}"
            else . end)' > postman/env_injected.json

      - name: Run Newman tests
        run: |
          newman run postman/REST_API_test.postman_collection.json \
            -e postman/env_injected.json \
            --insecure \
            --reporters cli,htmlextra,junitfull \
            --reporter-htmlextra-export reports/TestReport.html \
            --reporter-htmlextra-title "UAT API Test Report" \
            --reporter-junitfull-export reports/results.xml
        continue-on-error: true

      # ✅ Fix Error 1 — now results.xml exists for this step
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/results.xml
          check_name: "Newman API Test Results"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/TestReport.html
