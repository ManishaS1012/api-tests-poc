name: API Tests — Newman

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    # ✅ Fix Issue 2 — force Node.js 24 for all actions
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'         # ✅ upgraded from 20 to 24

      - name: Install Newman and reporters
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
          npm install -g newman-reporter-junitfull

      - name: Create reports folder
        run: mkdir -p reports

      - name: Debug — verify files exist
        run: |
          echo "=== Postman folder contents ==="
          ls -la postman/postman/ || ls -la postman/ || echo "No postman folder found"

      - name: Inject secrets into environment file
        run: |
          cat postman/postman/Test_Environment.postman_environment.json | \
          jq '.values |= map(
            if .key == "BaseURL" then .value = "${{ secrets.BASE_URL }}"
            elif .key == "Username" then .value = "${{ secrets.API_USERNAME }}"
            elif .key == "Password" then .value = "${{ secrets.API_PASSWORD }}"
            else . end)' > postman/postman/env_injected.json

      - name: Run Newman tests
        # ✅ Fix Issue 1 — continue even if tests fail so report is always uploaded
        continue-on-error: true
        run: |
          newman run postman/postman/REST_API_test.postman_collection.json \
            -e postman/postman/env_injected.json \
            --insecure \
            --reporters cli,htmlextra,junitfull \
            --reporter-htmlextra-export reports/TestReport.html \
            --reporter-htmlextra-title "UAT API Test Report" \
            --reporter-junitfull-export reports/results.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/results.xml
          check_name: "Newman API Test Results"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Artifact now named correctly
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-test-results
          path: |
            reports/TestReport.html
            reports/results.xml
