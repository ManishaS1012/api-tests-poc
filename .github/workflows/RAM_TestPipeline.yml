name: RAM_TestPipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:              # ✅ allows manual trigger from Actions tab

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js setup ──────────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ── 3. Install Newman + all reporters ─────────────────
      - name: Install Newman and reporters
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
          npm install -g newman-reporter-junitfull

      # ── 4. Create output folders ──────────────────────────
      - name: Create reports folder
        run: mkdir -p reports results

      # ── 5. Debug — verify files exist ─────────────────────
      - name: Debug — verify files exist
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== Postman folder ==="
          ls -la postman/ 2>/dev/null || echo "postman/ not found"
          echo "=== Postman/postman folder ==="
          ls -la postman/postman/ 2>/dev/null || echo "postman/postman/ not found"

      # ── 6. Inject secrets ─────────────────────────────────
      - name: Inject secrets into environment file
        run: |
          ENV_PATH="postman/environments/Test_Environment.postman_environment.json"
          OUT_PATH="postman/environments/env_injected.json"
          COL_PATH="postman/collections/REST_API_test.postman_collection.json"

          echo "✅ Collection : $COL_PATH"
          echo "✅ Environment: $ENV_PATH"
          echo "✅ Output     : $OUT_PATH"

          echo "COLLECTION=$COL_PATH" >> $GITHUB_ENV
          echo "ENV_FILE=$OUT_PATH"   >> $GITHUB_ENV

          cat $ENV_PATH | jq '.values |= map(
            if .key == "BaseURL"   then .value = "${{ secrets.BASE_URL }}"
            elif .key == "Username" then .value = "${{ secrets.API_USERNAME }}"
            elif .key == "Password" then .value = "${{ secrets.API_PASSWORD }}"
            else . end)' > $OUT_PATH

          echo "✅ env_injected.json created successfully"
          cat $OUT_PATH

     # ── 7. Run Newman ──────────────────────────────────────
      - name: Run Newman tests
        continue-on-error: true
        run: |
          newman run ${{ env.COLLECTION }} \
            -e ${{ env.ENV_FILE }} \
            --insecure \
            --reporters cli,htmlextra,junitfull,json \
            --reporter-htmlextra-export reports/TestReport.html \
            --reporter-htmlextra-title "UAT API Test Report — Run ${{ github.run_number }}" \
            --reporter-junitfull-export reports/results.xml \
            --reporter-json-export results/postman-results.json

      # ── 8. Publish results to GitHub Checks tab ───────────
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/results.xml
          check_name: "Newman API Test Results"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ── 9. Comment results on Pull Request ────────────────
      - name: Comment test results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            try {
              const results = JSON.parse(
                fs.readFileSync('./results/postman-results.json', 'utf8')
              );
              const stats = results.run.stats;
              const passed = stats.assertions.total - stats.assertions.failed;
              const status = stats.assertions.failed === 0 ? '✅ All Tests Passed' : '❌ Some Tests Failed';

              const comment = `## 🧪 Postman API Test Results — Run #${{ github.run_number }}
              
              ### ${status}
              
              | Metric | Count |
              |--------|-------|
              | Total Requests | ${stats.requests.total} |
              | ✅ Passed Assertions | ${passed} |
              | ❌ Failed Assertions | ${stats.assertions.failed} |
              | Total Assertions | ${stats.assertions.total} |
              
              📊 [View Full HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch(e) {
              console.log('Could not post PR comment:', e.message);
            }

      # ── 10. Upload all reports as artifact ────────────────
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-test-results-run-${{ github.run_number }}
          path: |
            reports/TestReport.html
            reports/results.xml
            results/postman-results.json
          retention-days: 30
